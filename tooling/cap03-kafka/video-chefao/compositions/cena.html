<script>
(function(){
const tl = gsap.timeline({ paused: true });
const T = {"boss": 2.32, "pg": 5.88, "avisa": 7.2, "fora": 9.372, "naosai": 10.512, "painel": 14.12, "chefao": 20.127, "intervalo": 21.627, "tentou": 24.935, "fila": 27.835, "voltou": 30.286, "reenvia": 31.166, "chave": 32.786, "chegou": 34.122, "derrotado": 36.562, "outbox": 39.585, "banco": 41.945, "transacao": 43.265, "publicado": 44.565, "fimcard": 46.5};
const F = {"C01": {"s": 0.8, "d": 2.74}, "C02": {"s": 3.94, "d": 4.272}, "C03": {"s": 8.712, "d": 2.508}, "C04": {"s": 11.62, "d": 4.087}, "C05": {"s": 16.107, "d": 6.548}, "C06": {"s": 23.155, "d": 5.991}, "C07": {"s": 29.946, "d": 3.576}, "C08": {"s": 34.122, "d": 3.344}, "C09": {"s": 38.065, "d": 8.034}};
const P = (s) => "#cena-" + s;
function falar(nome, k) {
  const f = F[k], n = Math.max(2, 2 * Math.floor(f.d / 0.26));
  tl.to(P(nome + "-boca"), { opacity: 1, duration: 0.13, ease: "steps(1)", repeat: n - 1, yoyo: true }, f.s);
  tl.to(P(nome + "-corpo"), { y: -6, duration: 0.26, ease: "steps(1)", repeat: Math.max(1, Math.floor(f.d / 0.26) * 2 - 1), yoyo: true }, f.s);
}
function andar(nome, de, ate, t, dur) {
  tl.fromTo(P(nome), { x: de }, { x: ate, duration: dur, ease: "steps(" + Math.max(2, Math.round(dur * 8)) + ")" }, t);
  tl.to(P(nome + "-corpo"), { y: -10, duration: 0.125, ease: "steps(1)", repeat: Math.max(1, Math.round(dur * 8) - 1), yoyo: true }, t);
}
function surge(sel, t) { tl.fromTo(P(sel), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.06, ease: "steps(1)" }, t); }
function some(sel, t) { tl.to(P(sel), { opacity: 0, duration: 0.2, ease: "steps(2)" }, t); }
function pisca(sel, t, n) { tl.to(P(sel), { opacity: 0.2, duration: 0.15, ease: "steps(1)", repeat: (n || 3) * 2 - 1, yoyo: true }, t); }
function treme(sel, t) { tl.to(P(sel), { x: 10, duration: 0.05, ease: "steps(1)", repeat: 7, yoyo: true }, t); }
function fimDeFase(t) {
  tl.to(P("mundo"), { opacity: 0, duration: 0.3, ease: "steps(3)" }, t);
  tl.fromTo(P("fimcard"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "steps(5)" }, t + 0.2);
}
function faixa(t, dur) {
  tl.fromTo(P("faixa"), { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "steps(4)" }, t);
  tl.to(P("faixa"), { scaleY: 0, duration: 0.2, ease: "steps(4)" }, t + dur);
}

tl.set([P("fimcard"), P("boss"), P("hp"), P("nomeboss"), P("pg"), P("off"), P("zz"), P("inv"), P("tiro"), P("power"), P("alerta"), P("telao")], { opacity: 0 }, 0);
faixa(0.1, F.C01.d + 0.6);
falar("tico", "C01");
tl.fromTo(P("telao"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "steps(2)" }, F.C01.d + 0.8);
falar("beto", "C02");
surge("pg", T.pg);
tl.fromTo(P("db"), { y: 0 }, { y: -10, duration: 0.1, ease: "steps(1)", repeat: 3, yoyo: true }, T.pg);
falar("beto", "C03");
tl.set(P("on"), { opacity: 0 }, T.fora); surge("off", T.fora);
tl.to(P("srv") + " svg", { opacity: 0.35, duration: 0.2, ease: "steps(2)" }, T.fora);
tl.fromTo(P("zz"), { opacity: 0, y: 10 }, { opacity: 1, y: -6, duration: 0.5, ease: "steps(3)", repeat: 7, yoyo: true }, T.fora + 0.2);
// O chefão aparece no intervalo entre as duas escritas.
surge("boss", T.naosai); surge("hp", T.naosai); surge("nomeboss", T.naosai);
tl.to(P("boss"), { y: -8, duration: 0.3, ease: "steps(1)", repeat: 23, yoyo: true }, T.naosai + 0.3);
falar("lia", "C04");
surge("alerta", T.painel); treme("painel", T.painel);
falar("tico", "C05");
pisca("nomeboss", T.chefao, 3);
falar("tico", "C06");
surge("inv", T.fila);
tl.to(P("inv"), { scale: 1.08, transformOrigin: "0% 100%", duration: 0.15, ease: "steps(1)", repeat: 3, yoyo: true }, T.fila + 0.1);
// Kafka volta; Beto reenvia o mesmo resultado.
falar("beto", "C07");
tl.set(P("off"), { opacity: 0 }, T.voltou); tl.set(P("on"), { opacity: 1 }, T.voltou);
tl.to(P("srv") + " svg", { opacity: 1, duration: 0.1, ease: "steps(1)" }, T.voltou); some("zz", T.voltou);
tl.fromTo(P("tiro"), { opacity: 1, x: 0 }, { x: 760, duration: 0.6, ease: "steps(8)" }, T.reenvia);
tl.to(P("tiro"), { opacity: 0, duration: 0.1, ease: "steps(1)" }, T.reenvia + 0.62);
tl.to(P("vida"), { scaleX: 0.35, duration: 0.2, ease: "steps(3)" }, T.reenvia + 0.6);
treme("boss", T.reenvia + 0.6);
some("inv", T.chave);
falar("lia", "C08");
tl.set(P("n"), { textContent: "4" }, T.chegou); some("alerta", T.chegou);
tl.to(P("painel"), { scale: 1.06, duration: 0.15, ease: "steps(1)", repeat: 3, yoyo: true }, T.chegou);
tl.to(P("vida"), { scaleX: 0, duration: 0.2, ease: "steps(3)" }, T.derrotado - 0.3);
tl.to(P("boss"), { scale: 1.4, opacity: 0, duration: 0.5, ease: "steps(5)" }, T.derrotado);
some("nomeboss", T.derrotado); some("hp", T.derrotado);
// Power-up do próximo mundo.
falar("tico", "C09");
tl.fromTo(P("power"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "steps(4)" }, T.outbox);
tl.set(P("powersub"), { opacity: 0 }, 0); surge("powersub", T.transacao);
tl.to(P("power"), { y: -10, duration: 0.25, ease: "steps(1)", repeat: 9, yoyo: true }, T.outbox + 0.4);
fimDeFase(T.fimcard);

window.__timelines["cena"] = tl;
})();
