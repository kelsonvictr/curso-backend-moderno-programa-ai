<script>
(function(){
const tl = gsap.timeline({ paused: true });
const T = {"esquece": 6.966, "roteamento": 7.986, "guarda": 11.426, "replay": 13.466, "fimcard": 68.04, "certo": 66.027, "r1": 14.896, "c1": 21.41, "v1": 24.565, "r2": 28.57, "c2": 33.6, "v2": 36.753, "r3": 40.061, "c3": 43.75, "v3": 46.897, "r4": 50.902, "c4": 56.54, "v4": 59.689};
const F = {"D01": {"s": 0.8, "d": 2.786}, "D02": {"s": 3.986, "d": 10.31}, "D03": {"s": 14.896, "d": 6.269}, "D04": {"s": 24.565, "d": 3.204}, "D05": {"s": 28.57, "d": 4.783}, "D06": {"s": 36.753, "d": 2.508}, "D07": {"s": 40.061, "d": 3.437}, "D08": {"s": 46.897, "d": 3.204}, "D09": {"s": 50.902, "d": 5.387}, "D10": {"s": 59.689, "d": 3.019}, "D11": {"s": 63.507, "d": 4.133}};
const P = (s) => "#cena-" + s;
function falar(nome, k) {
  const f = F[k], n = Math.max(2, 2 * Math.floor(f.d / 0.26));
  tl.to(P(nome + "-boca"), { opacity: 1, duration: 0.13, ease: "steps(1)", repeat: n - 1, yoyo: true }, f.s);
  tl.to(P(nome + "-corpo"), { y: -6, duration: 0.26, ease: "steps(1)", repeat: Math.max(1, Math.floor(f.d / 0.26) * 2 - 1), yoyo: true }, f.s);
}
function andar(nome, de, ate, t, dur) {
  tl.fromTo(P(nome), { x: de }, { x: ate, duration: dur, ease: "steps(" + Math.max(2, Math.round(dur * 8)) + ")" }, t);
  tl.to(P(nome + "-corpo"), { y: -10, duration: 0.125, ease: "steps(1)", repeat: Math.max(1, Math.round(dur * 8) - 1), yoyo: true }, t);
}
function surge(sel, t) { tl.fromTo(P(sel), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.06, ease: "steps(1)" }, t); }
function some(sel, t) { tl.to(P(sel), { opacity: 0, duration: 0.2, ease: "steps(2)" }, t); }
function pisca(sel, t, n) { tl.to(P(sel), { opacity: 0.2, duration: 0.15, ease: "steps(1)", repeat: (n || 3) * 2 - 1, yoyo: true }, t); }
function treme(sel, t) { tl.to(P(sel), { x: 10, duration: 0.05, ease: "steps(1)", repeat: 7, yoyo: true }, t); }
function fimDeFase(t) {
  tl.to(P("mundo"), { opacity: 0, duration: 0.3, ease: "steps(3)" }, t);
  tl.fromTo(P("fimcard"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "steps(5)" }, t + 0.2);
}
function faixa(t, dur) {

  tl.to(P("faixa"), { scaleY: 0, duration: 0.2, ease: "steps(4)" }, t + dur);

tl.set([P("fimcard"), P("telao"), P("decidam"), P("fila-vence"), P("log-vence"),

for (let i = 1; i <= 4; i++) [3, 2, 1].forEach(n => tl.set(P("n" + i + n), { opacity: 0 }, 0));
faixa(0.1, F.D01.d + 0.6);

let pf = 0, pl = 0;
[1, 2, 3, 4].forEach(i => {
  const r = T["r" + i], c = T["c" + i], v = T["v" + i];
  if (i > 1) { some("round" + (i - 1), r - 0.2); some("fila-vence", r - 0.2); some("log-vence", r - 0.2);
               tl.to([P("fila"), P("log")], { opacity: 1, duration: 0.1, ease: "steps(1)" }, r - 0.2); }
  surge("round" + i, r);
  falar("lia", ["D03", "D05", "D07", "D09"][i - 1]);
  // Contagem: a turma decide antes do Beto.
  tl.to(P("vs"), { opacity: 0, duration: 0.05, ease: "steps(1)" }, c);
  surge("decidam", c);
  [3, 2, 1].forEach((n, j) => { surge("n" + i + n, c + j * 1.0); tl.set(P("n" + i + n), { opacity: 0 }, c + j * 1.0 + 0.95); });
  some("decidam", v - 0.05);

  falar("beto", ["D04", "D06", "D08", "D10"][i - 1]);
  const ganha = VENC[i], perde = ganha === "fila" ? "log" : "fila";
  surge(ganha + "-vence", v + 0.1);
  tl.to(P(perde), { opacity: 0.3, duration: 0.1, ease: "steps(1)" }, v + 0.1);
  tl.to(P(ganha + "-spr"), { y: -14, duration: 0.15, ease: "steps(1)", repeat: 7, yoyo: true }, v + 0.1);
  if (ganha === "fila") { pf++; tl.set(P("pf"), { textContent: String(pf) }, v + 0.1); }
  else { pl++; tl.set(P("pl"), { textContent: String(pl) }, v + 0.1); }
  tl.to(P("placar"), { scale: 1.15, transformOrigin: "100% 50%", duration: 0.12, ease: "steps(1)", repeat: 3, yoyo: true }, v + 0.1);

tl.to([P("fila"), P("log")], { opacity: 1, duration: 0.1, ease: "steps(1)" }, F.D11.s);
falar("tico", "D11");

fimDeFase(T.fimcard);

window.__timelines["cena"] = tl;
