<script>
(function(){
const tl = gsap.timeline({ paused: true });
const P = (s) => "#fase2-" + s;
function falar(nome, t, dur) {
  const n = Math.max(2, 2 * Math.floor(dur / 0.26));
  tl.to(P(nome + "-boca"), { opacity: 1, duration: 0.13, ease: "steps(1)", repeat: n - 1, yoyo: true }, t);
  tl.to(P(nome + "-corpo"), { y: -6, duration: 0.26, ease: "steps(1)", repeat: Math.max(1, Math.floor(dur / 0.26) * 2 - 1), yoyo: true }, t);
}
function andar(nome, de, ate, t, dur) {
  tl.fromTo(P(nome), { x: de }, { x: ate, duration: dur, ease: "steps(" + Math.max(2, Math.round(dur * 8)) + ")" }, t);
  tl.to(P(nome + "-corpo"), { y: -10, duration: 0.125, ease: "steps(1)", repeat: Math.max(1, Math.round(dur * 8) - 1), yoyo: true }, t);
}

tl.to(P("nuvem1"), { x: 100, duration: 24, ease: "steps(30)" }, 0);
tl.to(P("nuvem2"), { x: -80, duration: 24, ease: "steps(26)" }, 0);
tl.fromTo(P("faixa"), { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "steps(4)" }, 0.1);
tl.to(P("faixa"), { scaleY: 0, duration: 0.2, ease: "steps(4)" }, 2.7);
tl.set([P("lin0"), P("lin1"), P("lin2"), P("mbeto"), P("mlia"), P("mtico"), P("cadeado"), P("regra"), P("mais"), P("cal"), P("placa")], { opacity: 0 }, 0);
tl.from(P("cad"), { scale: 0, duration: 0.4, ease: "steps(6)" }, 2.8);
// Beto escreve: cada pedido vira uma linha, com número (offset).
falar("beto", 3.0, 3.947);
[3.5, 4.66, 6.2].forEach((t, i) => {
  tl.fromTo(P("lin" + i), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.2, ease: "steps(3)" }, t);
  tl.set(P("num"), { textContent: String(i + 1) }, t);
});
// Marcador do Beto anda até a linha 3.
falar("beto", 7.3, 3.529);
tl.fromTo(P("mbeto"), { opacity: 0, y: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)" }, 7.5);
[1, 2, 3].forEach((n, i) => tl.to(P("mbeto"), { y: n * 90, duration: 0.12, ease: "steps(2)" }, 7.8999999999999995 + i * 0.4));
tl.fromTo(P("cadeado"), { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "steps(3)" }, 9.46);
tl.to(P("cad"), { x: 6, duration: 0.05, ease: "steps(1)", repeat: 3, yoyo: true }, 9.5);
tl.fromTo(P("regra"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "steps(1)", repeat: 2, yoyo: true }, 9.46);
tl.set(P("regra"), { opacity: 1 }, 10.1);
// Lia chega e lê desde a linha 0.
andar("lia", -200, 520, 10.5, 0.7);
falar("lia", 11.2, 4.412);
tl.fromTo(P("mlia"), { opacity: 0, y: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)" }, 12.2);
[1, 2, 3].forEach((n, i) => tl.to(P("mlia"), { y: n * 90, duration: 0.12, ease: "steps(2)" }, 13.0 + i * 0.4));
tl.fromTo(P("mais"), { opacity: 1, y: 0 }, { y: -50, duration: 1.2, ease: "steps(8)" }, 14.5);
tl.to(P("mais"), { opacity: 0, duration: 0.2, ease: "steps(2)" }, 15.6);
// Tico chega atrasado (fim do mês).
andar("tico", 2000, 720, 15.0, 1.0);
tl.fromTo(P("placa"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "steps(1)", repeat: 4, yoyo: true }, 16.0);
tl.set(P("placa"), { opacity: 1 }, 17.4);
falar("tico", 16.2, 3.576);
tl.fromTo(P("cal"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.2, ease: "steps(3)" }, 18.8);
// Lia libera: Tico lê desde o começo (rebobina e avança).
falar("lia", 20.1, 3.344);
tl.fromTo(P("mtico"), { opacity: 0, y: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)" }, 20.560000000000002);
tl.to(P("mtico"), { scale: 1.2, duration: 0.1, ease: "steps(1)", repeat: 3, yoyo: true }, 20.6);
[1, 2, 3].forEach((n, i) => tl.to(P("mtico"), { y: n * 90, duration: 0.12, ease: "steps(2)" }, 21.6 + i * 0.5));
tl.to(P("cad"), { boxShadow: "16px 16px 0 #1a1c2c, 0 0 0 14px #a7f070", duration: 0.15, ease: "steps(1)", repeat: 3, yoyo: true }, 22.0);

window.__timelines["fase2"] = tl;
})();
