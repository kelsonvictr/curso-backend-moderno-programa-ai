(function(){
const tl = gsap.timeline({ paused: true });
const P = (s) => "#fase2-" + s;
function falar(nome, t, dur) {
  const n = Math.max(2, 2 * Math.floor(dur / 0.26));
  tl.to(P(nome + "-boca"), { opacity: 1, duration: 0.13, ease: "steps(1)", repeat: n - 1, yoyo: true }, t);

}

  tl.fromTo(P(nome), { x: de }, { x: ate, duration: dur, ease: "steps(" + Math.max(2, Math.round(dur * 8)) + ")" }, t);
  tl.to(P(nome + "-corpo"), { y: -10, duration: 0.125, ease: "steps(1)", repeat: Math.max(1, Math.round(dur * 8) - 1), yoyo: true }, t);

[1, 2, 3].forEach((n, i) => tl.to(P("mlia"), { y: n * 90, duration: 0.12, ease: "steps(2)" }, 13.0 + i * 0.4));
tl.fromTo(P("mais"), { opacity: 1, y: 0 }, { y: -50, duration: 1.2, ease: "steps(8)" }, 14.5);
tl.to(P("mais"), { opacity: 0, duration: 0.2, ease: "steps(2)" }, 15.6);
// Tico chega atrasado (fim do mês).
andar("tico", 2000, 720, 15.0, 1.0);
tl.fromTo(P("placa"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "steps(1)", repeat: 4, yoyo: true }, 16.0);
tl.set(P("placa"), { opacity: 1 }, 17.4);
falar("tico", 16.2, 3.576);
tl.fromTo(P("cal"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.2, ease: "steps(3)" }, 18.8);

falar("lia", 20.1, 3.344);
tl.fromTo(P("mtico"), { opacity: 0, y: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)" }, 20.560000000000002);
tl.to(P("mtico"), { scale: 1.2, duration: 0.1, ease: "steps(1)", repeat: 3, yoyo: true }, 20.6);
[1, 2, 3].forEach((n, i) => tl.to(P("mtico"), { y: n * 90, duration: 0.12, ease: "steps(2)" }, 21.6 + i * 0.5));
tl.to(P("cad"), { boxShadow: "16px 16px 0 #1a1c2c, 0 0 0 14px #a7f070", duration: 0.15, ease: "steps(1)", repeat: 3, yoyo: true }, 22.0);
