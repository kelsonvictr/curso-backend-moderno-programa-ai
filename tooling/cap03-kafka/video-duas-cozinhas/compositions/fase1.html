<script>
(function(){
const tl = gsap.timeline({ paused: true });
const P = (s) => "#fase1-" + s;
function falar(nome, t, dur) {
  const n = Math.max(2, 2 * Math.floor(dur / 0.26));
  tl.to(P(nome + "-boca"), { opacity: 1, duration: 0.13, ease: "steps(1)", repeat: n - 1, yoyo: true }, t);
  tl.to(P(nome + "-corpo"), { y: -6, duration: 0.26, ease: "steps(1)", repeat: Math.max(1, Math.floor(dur / 0.26) * 2 - 1), yoyo: true }, t);
}
function andar(nome, de, ate, t, dur) {
  tl.fromTo(P(nome), { x: de }, { x: ate, duration: dur, ease: "steps(" + Math.max(2, Math.round(dur * 8)) + ")" }, t);
  tl.to(P(nome + "-corpo"), { y: -10, duration: 0.125, ease: "steps(1)", repeat: Math.max(1, Math.round(dur * 8) - 1), yoyo: true }, t);
}

// Ambiente: nuvens andando em degraus.
tl.to(P("nuvem1"), { x: 120, duration: 9.6, ease: "steps(24)" }, 0);
tl.to(P("nuvem2"), { x: -90, duration: 9.6, ease: "steps(18)" }, 0);
// Faixa de abertura da fase.
tl.fromTo(P("faixa"), { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "steps(4)" }, 0.1);
tl.to(P("faixa"), { scaleY: 0, duration: 0.2, ease: "steps(4)" }, 2.7);
tl.set([P("cmd1"), P("cmd2"), P("cmd3"), P("cafe"), P("pao"), P("bolo"), P("pronto1"), P("pronto2"), P("pronto3"), P("over"), P("placa"), P("vendas")], { opacity: 0 }, 0);
// Comanda 1: chega pelo trilho, café, pronto, lixo.
tl.fromTo(P("cmd1"), { x: -560, opacity: 1 }, { x: 0, duration: 0.4, ease: "steps(6)" }, 3.0);
tl.set(P("num"), { textContent: "1" }, 3.0);
falar("beto", 3.0, 2.879);
tl.set(P("cafe"), { opacity: 1 }, 4.0600000000000005);
tl.fromTo(P("pronto1"), { opacity: 1, y: 0 }, { y: -40, opacity: 0, duration: 0.8, ease: "steps(6)" }, 4.36);

tl.set(P("cmd1"), { opacity: 0 }, 5.42);
tl.to(P("cafe"), { opacity: 0, duration: 0.2, ease: "steps(2)" }, 5.4);
tl.to(P("lixeira"), { y: -12, duration: 0.08, ease: "steps(1)", repeat: 3, yoyo: true }, 5.42);
// Comandas 2 e 3: pão de queijo e bolo, tudo pro lixo.
tl.fromTo(P("cmd2"), { x: -720, opacity: 1 }, { x: 0, duration: 0.35, ease: "steps(6)" }, 6.0);
tl.set(P("num"), { textContent: "2" }, 6.0);
falar("beto", 6.3, 2.926);
tl.set(P("pao"), { opacity: 1 }, 6.3999999999999995);
tl.fromTo(P("pronto2"), { opacity: 1, y: 0 }, { y: -40, opacity: 0, duration: 0.6, ease: "steps(5)" }, 6.84);
tl.fromTo(P("cmd3"), { x: -880, opacity: 1 }, { x: 0, duration: 0.3, ease: "steps(5)" }, 6.95);
tl.set(P("num"), { textContent: "3" }, 6.95);
tl.set(P("bolo"), { opacity: 1 }, 7.3);
tl.fromTo(P("pronto3"), { opacity: 1, y: 0 }, { y: -40, opacity: 0, duration: 0.5, ease: "steps(4)" }, 7.4799999999999995);
tl.to(P("cmd2"), { keyframes: [{ x: 200, y: -120, rotation: 90, duration: 0.15 }, { x: 470, y: 290, rotation: 200, scale: 0.6, duration: 0.18 }], ease: "steps(3)" }, 7.92);
tl.set(P("cmd2"), { opacity: 0 }, 8.26);
tl.to(P("cmd3"), { keyframes: [{ x: 150, y: -120, rotation: -90, duration: 0.15 }, { x: 320, y: 290, rotation: -200, scale: 0.6, duration: 0.18 }], ease: "steps(3)" }, 8.28);
tl.set(P("cmd3"), { opacity: 0 }, 8.62);
tl.to([P("pao"), P("bolo")], { opacity: 0, duration: 0.2, ease: "steps(2)" }, 8.6);
tl.to(P("lixeira"), { y: -12, duration: 0.08, ease: "steps(1)", repeat: 7, yoyo: true }, 8.26);
// Anoitece.
tl.to(P("noite"), { opacity: 1, duration: 1.0, ease: "steps(5)" }, 9.6);
tl.to(P("nuvem1"), { opacity: 0, duration: 0.6, ease: "steps(3)" }, 9.6);
tl.to(P("nuvem2"), { opacity: 0, duration: 0.6, ease: "steps(3)" }, 9.6);
