spring.application.name=biblioteca-spring
server.port=8080

# Kafka no seu computador (docker compose up -d). Chave e valor viajam como texto.
spring.kafka.bootstrap-servers=localhost:9092
# Kafka fora do ar? Desiste em 5 s em vez de travar a devolução por 1 minuto.
spring.kafka.producer.properties.max.block.ms=5000
