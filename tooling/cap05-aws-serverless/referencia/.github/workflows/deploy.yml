name: Deploy do backend

# Quando rodar: a cada push na main, ou pelo botão "Run workflow".
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # Uma máquina Linux novinha, emprestada pelo GitHub, que some no fim.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # CI: se um teste falhar, o roteiro para aqui e nada vai para a AWS.
      - name: Rodar os testes
        run: ./mvnw -B test

      - name: Gerar o jar
        run: ./mvnw -B package -DskipTests

      - name: Instalar o Node (o Serverless Framework roda nele)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar o Serverless Framework v3
        run: npm install -g serverless@3

      # As chaves vêm dos Secrets do repositório. Elas nunca aparecem no código nem no log.
      - name: Entrar na AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # CD: o mesmo comando que você rodava no notebook.
      - name: Publicar na AWS
        run: serverless deploy --stage dev
