const T = {"montou": 3.94, "clicando": 6.22, "trinta": 7.655, "funcao": 8.895, "porta": 9.415, "permissao": 10.215, "igual": 13.814, "testes": 14.554, "cliquei": 17.601, "caixinha": 20.361, "duas": 21.321, "memoria": 24.15, "falha": 26.45, "infra": 33.003, "arquivo": 35.423, "existir": 37.763, "comando": 44.508, "cria": 46.108, "sempre": 47.568, "historico": 51.548, "quem": 53.008, "quando": 53.748, "porque": 54.908, "apagar": 58.624, "apaga": 61.607, "recria": 62.827, "fimcard": 70.47};
const F = {"01": {"s": 0.8, "d": 6.455}, "02": {"s": 7.655, "d": 4.319}, "03": {"s": 12.474, "d": 3.947}, "04": {"s": 16.821, "d": 5.108}, "05": {"s": 22.43, "d": 5.108}, "06": {"s": 28.038, "d": 3.065}, "07": {"s": 31.503, "d": 7.338}, "08": {"s": 39.241, "d": 1.347}, "09": {"s": 40.888, "d": 7.663}, "10": {"s": 49.05, "d": 1.718}, "11": {"s": 51.068, "d": 6.455}, "12": {"s": 58.024, "d": 2.043}, "13": {"s": 60.367, "d": 9.706}};
const P = (s) => "#cena-" + s;
function falar(nome, k) {
  const f = F[k], n = Math.max(2, 2 * Math.floor(f.d / 0.26));
  tl.to(P(nome + "-boca"), { opacity: 1, duration: 0.13, ease: "steps(1)", repeat: n - 1, yoyo: true }, f.s);
  tl.to(P(nome + "-corpo"), { y: -6, duration: 0.26, ease: "steps(1)", repeat: Math.max(1, Math.floor(f.d / 0.26) * 2 - 1), yoyo: true }, f.s);
}
function andar(nome, de, ate, t, dur) {
  tl.fromTo(P(nome), { x: de }, { x: ate, duration: dur, ease: "steps(" + Math.max(2, Math.round(dur * 8)) + ")" }, t);
  tl.to(P(nome + "-corpo"), { y: -10, duration: 0.125, ease: "steps(1)", repeat: Math.max(1, Math.round(dur * 8) - 1), yoyo: true }, t);
}
function surge(sel, t) { tl.fromTo(P(sel), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.06, ease: "steps(1)" }, t); }
function some(sel, t) { tl.to(P(sel), { opacity: 0, duration: 0.2, ease: "steps(2)" }, t); }
function pisca(sel, t, n) { tl.to(P(sel), { opacity: 0.2, duration: 0.15, ease: "steps(1)", repeat: (n || 3) * 2 - 1, yoyo: true }, t); }
function pula(sel, t, n) { tl.to(P(sel), { y: -14, duration: 0.12, ease: "steps(1)", repeat: (n || 2) * 2 - 1, yoyo: true }, t); }
function reage(i, txt, t, dur) { tl.set(P("balao" + i), { textContent: txt }, t); surge("balao" + i, t); pula("aluno" + i, t, 2); some("balao" + i, t + (dur || 1.6)); }
function contagem(t) { tl.set([P("decidam"), P("cd3"), P("cd2"), P("cd1")], { opacity: 0 }, 0); surge("decidam", t);
  [3, 2, 1].forEach((n, j) => { surge("cd" + n, t + j); tl.set(P("cd" + n), { opacity: 0 }, t + j + 0.95); }); tl.set(P("decidam"), { opacity: 0 }, t + 2.95); }

  tl.to(P("faixa"), { scaleY: 0, duration: 0.2, ease: "steps(4)" }, t + dur);

falar("beto", "02");

[9, 18, 27, 37].forEach((n, i) => tl.set(P("ncl"), { textContent: String(n) }, T.trinta + 0.1 + i * 0.18));

reage(0, "UAU", T.permissao + 0.5);

surge("ct", T.testes);
falar("beto", "04");
treme("beto", T.cliquei);
surge("q0", T.cliquei); surge("q1", T.caixinha); surge("q2", T.duas);
reage(1, "KKKK", T.duas + 0.2); reage(3, "HAHA", T.duas + 0.5);
falar("tico", "05");
surge("falhou", T.memoria); treme("ct", T.falha); reage(2, "IH...", T.falha + 0.2);
falar("lia", "06");

falar("tico", "07");
some("fa", T.infra); some("tag", T.infra);
tl.set(P("fb"), { opacity: 1 }, T.infra + 0.15); surge("tagok", T.infra + 0.15);

falar("beto", "08");
falar("tico", "09");
surge("dep", T.comando);
surge("n1", T.cria); surge("n1p", T.cria + 0.2); surge("n2", T.cria + 0.5); surge("n2p", T.cria + 0.7);
surge("iguais", T.sempre); reage(0, "AHH!", T.sempre + 0.3);
falar("lia", "10");
falar("tico", "11");
surge("git", T.historico); surge("g0", T.quem); surge("g1", T.quando); surge("g2", T.porque);
falar("beto", "12");
falar("tico", "13");
tl.set(P("dep"), { opacity: 0 }, T.apaga); surge("rm", T.apaga);
some("n1p", T.apaga + 0.15); some("n2p", T.apaga + 0.15); some("iguais", T.apaga + 0.15);
tl.set(P("rm"), { opacity: 0 }, T.recria); surge("dep", T.recria);
surge("n1p", T.recria + 0.2); surge("n2p", T.recria + 0.35); surge("iguais", T.recria + 0.6);
reage(2, "UAU", T.recria + 0.6);

tl.set(P("telao"), { opacity: 0 }, T.fimcard - 0.05);
